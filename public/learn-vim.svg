<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Vim Ustasi project cover</title>
  <desc id="desc">Terminal inspired cover image for a Vim learning game.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#031407"/>
      <stop offset="0.55" stop-color="#071f10"/>
      <stop offset="1" stop-color="#020805"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g opacity="0.08" stroke="#bbf7d0" stroke-width="1">
    <path d="M0 84h1200M0 168h1200M0 252h1200M0 336h1200M0 420h1200M0 504h1200M0 588h1200"/>
    <path d="M100 0v675M200 0v675M300 0v675M400 0v675M500 0v675M600 0v675M700 0v675M800 0v675M900 0v675M1000 0v675M1100 0v675"/>
  </g>
  <g transform="translate(150 105)">
    <rect width="900" height="465" rx="28" fill="#07120a" stroke="#245c35" stroke-width="3"/>
    <rect width="900" height="58" rx="28" fill="#0d1d12"/>
    <circle cx="42" cy="29" r="10" fill="#ef4444"/>
    <circle cx="76" cy="29" r="10" fill="#f59e0b"/>
    <circle cx="110" cy="29" r="10" fill="#22c55e"/>
    <text x="450" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" fill="#86efac">learn-vim.aliyasirnac.com</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="62" y="135" font-size="30" fill="#64748b">1</text>
      <text x="62" y="190" font-size="30" fill="#64748b">2</text>
      <text x="62" y="245" font-size="30" fill="#64748b">3</text>
      <text x="62" y="300" font-size="30" fill="#64748b">~</text>
      <rect x="120" y="102" width="34" height="44" rx="4" fill="#4ade80" filter="url(#softGlow)"/>
      <text x="129" y="135" font-size="38" font-weight="700" fill="#06130a">v</text>
      <text x="166" y="135" font-size="38" fill="#dcfce7">im ogrenmek zor</text>
      <text x="120" y="190" font-size="38" fill="#dcfce7">ok tuslariyla gezmek yavas</text>
      <text x="120" y="245" font-size="38" fill="#dcfce7">tekrar eden isler sikici</text>
      <text x="120" y="350" font-size="24" fill="#fbbf24">:g/slow/s//fast/g</text>
    </g>
    <rect x="0" y="407" width="900" height="58" rx="0" fill="#050a07"/>
    <rect x="0" y="407" width="150" height="58" fill="#4ade80"/>
    <text x="75" y="444" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="700" fill="#06130a">NORMAL</text>
    <text x="178" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#86efac">dojo.txt</text>
    <text x="850" y="444" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#86efac">1:1</text>
  </g>
  <text x="600" y="632" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="54" font-weight="800" fill="#bbf7d0" filter="url(#softGlow)">VIM USTASI</text>
</svg>
